        <h1>The Paths We Choose</h1>
        <p>A free tabletop-inspired card adventure and dungeon crawler created by <strong>Morville Studios</strong> and <strong>Morville Games</strong>.</p>
        
        <h2>Choose Your Adventurer Class</h2>
        <ul>
          <li><strong>Fighter:</strong> Frontline warrior boasting high Strength and Vitality with the <em>Berzerk</em> damage bonus passive.</li>
          <li><strong>Wizard:</strong> Arcane master of fire and force fields, high Intelligence and Charisma with the <em>Conserve</em> Action Points passive.</li>
          <li><strong>Rogue:</strong> Quick and elusive skirmisher with high Agility and Dexterity with the <em>Steal</em> Gold passive on doubles.</li>
        </ul>

        <h2>Core Tabletop Mechanics</h2>
        <ul>
          <li><strong>Morville Adventure Card Game Path Generator™ (MACG-PG™):</strong> A proprietary board game strategy mechanic developed by Morville Studios, utilizing an offset-brick 3-row vision cone to generate tactical, dynamic dungeon paths across Grassland, Forest, and Swamp terrains.</li>
          <li><strong>MACG-3D6™ Combat Dice Checks:</strong> Roll three six-sided dice against target Evasion under the Morville Adventure Card Game 3d6 Success Roll Range Table Reference to strike with physical or magical Action Cards.</li>
          <li><strong>Sacred Shrines &amp; Stat Evolution:</strong> Spend inscribed Stat Points to permanently elevate Base Stats.</li>
          <li><strong>Village Havens:</strong> Rest at the tavern, buy and sell weaponry and gear, and learn powerful combat cards.</li>
          <li><strong>Epic Stage Boss Battles:</strong> Confront Grundy the Goblin Warlord and the Cult of Trolls on Turn 15.</li>
        </ul>

        <p><em>Note: JavaScript is required to play this browser card adventure.</em></p>
